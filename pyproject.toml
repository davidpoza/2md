[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "2md"
version = "0.1.0"
description = "Conversor de documentos a Markdown para Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.150.0",
    "docling-core==2.106.0",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "mcp==2.3.0",
    "mermaidx==0.11.3",
    "openai==1.109.1",
    "pydantic>=2.10,<3",
    "PySide6>=6.8,<7",
    "truststore==0.10.5",
]

[project.scripts]
2md = "twomd.app:main"

[dependency-groups]
package = [
    "pyinstaller>=6,<7",
]
dev = [
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/twomd"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
